name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database and seed reference data
        run: supabase db reset

      - name: Seed test users
        run: bash scripts/seed-users.sh

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build (includes type check)
        run: npm run build

      - name: Accessibility tests
        run: npx playwright test e2e/a11y/ --project=a11y --grep-invert calendar.a11y

      - name: Calendar a11y (isolated)
        run: npx playwright test e2e/a11y/calendar.a11y.spec.ts --project=a11y

      - name: Calendar E2E tests
        run: npx playwright test e2e/calendar.e2e.spec.ts --project=calendar-e2e
